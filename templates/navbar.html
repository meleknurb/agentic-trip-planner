<nav class="navbar">
    <div class="nav-container">
        <a href="{{ url_for('index') }}" class="nav-logo">Odyssey</a>
        <ul class="nav-links">

            {% if current_user.is_authenticated %}
                <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                <li><a href="{{ url_for('history') }}">Saved Routes</a></li>
                <li><a href="{{ url_for('settings') }}">Settings</a></li>
            {% else %}
                <li><a href="{{ url_for('login') }}" class="nav-login">Sign In</a></li>
                <li><a href="{{ url_for('register') }}" class="nav-register">Sign Up</a></li>
            {% endif %}
            
        </ul>
    </div>
</nav>
